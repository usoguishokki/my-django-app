{% extends "base.html" %}
{% load static %}

{% block title %}計画調整{% endblock %}

{% block extra_css %}
<link href="{% static 'css/components/drawer/_drawer.css' %}" rel="stylesheet" type="text/css">
<link href="{% static 'css/pages/planScheduling.css' %}" rel="stylesheet" type="text/css">
{% endblock %}

{% block header %}
{% include "header.html" %}
{% endblock %}

{% block content %}
<main class="plan-scheduling" data-role="plan-scheduling-root">
  <form class="plan-scheduling__dateForm" data-role="week-form">
    <label for="plan-scheduling-date">表示日</label>
    <div class="plan-scheduling__dateControls">
      <input id="plan-scheduling-date" type="date" data-role="target-date">
      <button type="submit" class="ui-btn ui-btn--outline plan-scheduling__weekButton">週を表示</button>
    </div>
  </form>

  <div class="plan-scheduling__feedback" data-role="feedback" role="status" aria-live="polite"></div>

  <section class="plan-scheduling__workspace" data-role="workspace" hidden>
    <div class="plan-scheduling__planningLayout" data-role="planning-layout">
      <aside class="plan-scheduling__drawer" data-role="slot-drawer" aria-labelledby="drawer-date" hidden>
        <header class="plan-scheduling__drawerHeader">
          <div>
            <h2 id="drawer-date" data-role="drawer-date"></h2>
            <p data-role="drawer-slot"></p>
            <strong data-role="drawer-summary"></strong>
          </div>
          <button type="button" class="plan-scheduling__drawerClose" data-action="close-drawer" aria-label="計画ドロワーを閉じる">×</button>
        </header>
        <div class="plan-scheduling__drawerContent">
          <div class="plan-scheduling__movePreviewRegion" data-role="move-preview" hidden></div>
          <div class="detail-cards detail-card-list plan-scheduling__planList" data-role="plan-list"></div>
        </div>
      </aside>

      <div class="plan-scheduling__planningMain">
        <div class="plan-scheduling__planningCanvas" data-role="planning-canvas">
          <section class="plan-scheduling__chart" aria-label="日別計画工数と保全週">
            <div data-role="workload-chart"></div>
            <div class="plan-scheduling__maintenanceWeek" data-role="maintenance-week" aria-label="保全週"></div>
          </section>

          <section class="plan-scheduling__matrix" aria-label="計画工数マトリクス">
            <div class="plan-scheduling__dateGrid" data-role="date-grid"></div>
          </section>
        </div>
      </div>
    </div>
  </section>
</main>
{% endblock %}

{% block script %}
<script type="module" src="{% static 'js/planScheduling/pages/planSchedulingPage.js' %}"></script>
{% endblock %}
