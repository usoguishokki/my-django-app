{% extends "base.html" %}
{% load plugin_urls %}


{% block title %}ログイン{% endblock %}
{% block extra_css %}
    <link href="{% plugin_sass 'css/login.scss' %}" rel="stylesheet" type="text/css">
{% endblock %}
    
{% block content %}
    <form class="sign-in" method="post" action="{% plugin_url 'login' %}" autocomplete="off">
        {% csrf_token %}
        <h1 class="sign-in-title">Sign in to Nika</h1>
        {% if form.login_number.errors %}
            <p class="error-message">{{ form.login_number.errors.0 }}</p>
        {% endif %}
        {{ form.login_number }}
        <div class="mybutton pull-back-button">
            <button type="submit">sign in</button>
        </div>
    </form>

    <script src="{% plugin_static 'js/login.js' %}"></script>
{% endblock %}
